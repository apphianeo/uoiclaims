<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 0 345 230" preserveAspectRatio="xMidYMid slice">
  <!-- Mock evidence photo: damaged hard-shell suitcase at the airport. Replace with a real photo any time. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ccd1"/>
      <stop offset="1" stop-color="#b4b8bf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9da2a9"/>
      <stop offset="1" stop-color="#7d828a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2f55"/>
      <stop offset="0.18" stop-color="#2b4a80"/>
      <stop offset="0.45" stop-color="#23406f"/>
      <stop offset="0.8" stop-color="#1a3159"/>
      <stop offset="1" stop-color="#132444"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1d38"/>
      <stop offset="1" stop-color="#172a4d"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f757d"/>
      <stop offset="0.45" stop-color="#e3e6ea"/>
      <stop offset="1" stop-color="#7b8189"/>
    </linearGradient>
    <radialGradient id="wheel" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4d53"/>
      <stop offset="1" stop-color="#16171a"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- airport: wall, baggage carousel, floor tiles -->
  <rect width="460" height="230" fill="url(#wall)"/>
  <rect y="96" width="460" height="18" fill="#8d9299"/>
  <g fill="#a9aeb5" stroke="#7f848b" stroke-width="0.8">
    <rect x="-10" y="100" width="60" height="10" rx="2"/><rect x="52" y="100" width="60" height="10" rx="2"/>
    <rect x="114" y="100" width="60" height="10" rx="2"/><rect x="176" y="100" width="60" height="10" rx="2"/>
    <rect x="238" y="100" width="60" height="10" rx="2"/><rect x="300" y="100" width="60" height="10" rx="2"/>
    <rect x="362" y="100" width="60" height="10" rx="2"/><rect x="424" y="100" width="60" height="10" rx="2"/>
  </g>
  <rect y="114" width="460" height="6" fill="#5f646b"/>
  <rect y="120" width="460" height="110" fill="url(#floor)"/>
  <g stroke="#6f747b" stroke-width="0.7" opacity="0.6">
    <line x1="0" y1="150" x2="460" y2="150"/><line x1="0" y1="190" x2="460" y2="190"/>
    <line x1="70" y1="120" x2="20" y2="230"/><line x1="180" y1="120" x2="160" y2="230"/>
    <line x1="290" y1="120" x2="305" y2="230"/><line x1="400" y1="120" x2="450" y2="230"/>
  </g>
  <!-- a second bag, out of focus, on the carousel -->
  <g filter="url(#blur2)" opacity="0.8">
    <rect x="360" y="62" width="70" height="42" rx="8" fill="#7a2f2f"/>
    <rect x="382" y="56" width="26" height="8" rx="3" fill="#3d1a1a"/>
  </g>

  <!-- floor shadow -->
  <ellipse cx="236" cy="214" rx="86" ry="10" fill="#000" opacity="0.35" filter="url(#blur6)"/>

  <!-- telescopic handle: the right rod is bent, grip twisted -->
  <rect x="207" y="30" width="6" height="46" fill="url(#chrome)"/>
  <path d="M251 76 L251 52 Q251 44 257 36 L262 28" fill="none" stroke="#c8ccd1" stroke-width="6" stroke-linecap="round"/>
  <path d="M251 76 L251 52 Q251 44 257 36 L262 28" fill="none" stroke="#7b8189" stroke-width="2" stroke-linecap="round" transform="translate(2 0)"/>
  <path d="M202 30 Q230 20 266 26 L265 35 Q231 30 203 39 Z" fill="#1f2226"/>
  <path d="M206 31 Q232 23 262 28" fill="none" stroke="#4a4f56" stroke-width="1.5"/>

  <!-- shell -->
  <rect x="172" y="72" width="16" height="136" rx="8" fill="url(#side)"/>
  <rect x="180" y="70" width="112" height="140" rx="13" fill="url(#shell)"/>
  <g stroke="#0f1f3d" stroke-width="2" opacity="0.55">
    <line x1="202" y1="82" x2="202" y2="198"/><line x1="224" y1="80" x2="224" y2="200"/>
    <line x1="248" y1="80" x2="248" y2="200"/><line x1="270" y1="82" x2="270" y2="198"/>
  </g>
  <g stroke="#3d5f99" stroke-width="1" opacity="0.6">
    <line x1="204" y1="82" x2="204" y2="198"/><line x1="226" y1="80" x2="226" y2="200"/>
    <line x1="250" y1="80" x2="250" y2="200"/><line x1="272" y1="82" x2="272" y2="198"/>
  </g>
  <rect x="180" y="70" width="112" height="140" rx="13" fill="url(#gloss)"/>
  <!-- corner guards, TSA lock, side handle, tag -->
  <g fill="#10192c">
    <path d="M180 88 Q180 70 198 70 L198 76 Q186 76 186 88 Z"/><path d="M292 88 Q292 70 274 70 L274 76 Q286 76 286 88 Z"/>
    <path d="M180 192 Q180 210 198 210 L198 204 Q186 204 186 192 Z"/><path d="M292 192 Q292 210 274 210 L274 204 Q286 204 286 192 Z"/>
  </g>
  <rect x="228" y="76" width="18" height="10" rx="2" fill="#2a2d33"/>
  <rect x="233" y="79" width="8" height="3" rx="1" fill="#8a9098"/>
  <rect x="173" y="120" width="6" height="26" rx="3" fill="#1b1d21"/>
  <path d="M174 128 C160 132 158 150 166 160" fill="none" stroke="#caa64a" stroke-width="1.2"/>
  <rect x="158" y="158" width="16" height="22" rx="2" fill="#e9dcae" transform="rotate(-8 166 169)"/>
  <!-- scuffs and a crack near the broken corner -->
  <g stroke="#9fb3d6" stroke-linecap="round" opacity="0.7">
    <path d="M262 180 l10 -6 M266 186 l12 -7 M258 190 l7 -3" stroke-width="1"/>
  </g>
  <path d="M286 176 L279 184 L283 189 L276 198" fill="none" stroke="#0a1426" stroke-width="1.4"/>

  <!-- wheels: front-left intact; front-right snapped off, lying on the floor -->
  <rect x="186" y="206" width="14" height="6" rx="2" fill="#2a2d33"/>
  <circle cx="193" cy="216" r="7" fill="url(#wheel)"/>
  <circle cx="193" cy="216" r="2" fill="#8a9098"/>
  <rect x="176" y="204" width="10" height="5" rx="2" fill="#23262b"/>
  <circle cx="181" cy="212" r="5" fill="url(#wheel)"/>
  <rect x="270" y="206" width="14" height="5" rx="2" fill="#2a2d33"/>
  <path d="M274 211 l2 5 l3 -3 l2 5" fill="none" stroke="#8a9098" stroke-width="1.6"/>
  <g transform="translate(318 214) rotate(-25)">
    <ellipse cx="0" cy="3" rx="9" ry="3" fill="#000" opacity="0.3" filter="url(#blur2)"/>
    <rect x="-7" y="-10" width="14" height="6" rx="2" fill="#2a2d33"/>
    <circle cx="0" cy="0" r="7" fill="url(#wheel)"/>
    <circle cx="0" cy="0" r="2" fill="#8a9098"/>
  </g>

  <!-- photo feel: grain and vignette -->
  <rect width="460" height="230" filter="url(#grain)" fill="#fff"/>
  <rect width="460" height="230" fill="url(#vignette)"/>
</svg>
